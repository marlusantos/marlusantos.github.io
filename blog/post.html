  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7C619LJ95Y', {
    anonymize_ip: true,
    send_page_view: false,
    debug_mode: true
  });
</script>

 <script>
  let scrollSent = false;

  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const percent = scrollTop / maxScroll;

    if (percent > 0.7 && !scrollSent) {
      scrollSent = true;
      gtag('event', 'scroll_70_blog', {
        article_slug: slug
      });
    }
  });
</script>

<script>
  if (document.referrer && document.referrer.includes('instagram.com')) {

    gtag('event', 'visit_from_instagram', {
      article_slug: slug
    });
  }
</script>

<script>
  document.addEventListener('postLoaded', (e) => {
    const { slug, title } = e.detail;

    // page_view correto por slug
    gtag('event', 'page_view', {
      page_title: title,
      page_location: location.origin + '/blog/' + slug,
      page_path: '/blog/' + slug
    });

    // evento customizado de leitura
    gtag('event', 'view_blog_article', {
      article_slug: slug,
      article_title: title
    });
  });
</script>
